<style>
/* Layout: 한 줄 읽기 기둥. 위에 모래시계, 가운데 지문. 전자책 리더처럼 종이·세피아·연두·밤 네 가지 읽기 색. */
:root{
  /* 종이: 흰 종이보다 눈부심이 덜한 미색 바탕, 순흑 대신 먹색 글자 */
  --bg:#F4EFE4; --paper:#FAF6EE; --ink:#2F2A23; --muted:#7A7164; --line:#E2D9C8;
  --sand:#AE772C; --sand-soft:#EBDDC3; --ok:#2F7A55; --bad:#B0443A;
  --f-display:"Song Myung","Gowun Batang",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171A; --paper:#1D2024; --ink:#D3CCBF; --muted:#8E887D; --line:#2D3136;
  --sand:#C99A55; --sand-soft:#3A3225; --ok:#6FC195; --bad:#E07B70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171A; --paper:#1D2024; --ink:#D3CCBF; --muted:#8E887D; --line:#2D3136;
  --sand:#C99A55; --sand-soft:#3A3225; --ok:#6FC195; --bad:#E07B70; color-scheme:dark}
/* 사용자가 고른 읽기 색은 시스템 테마보다 우선합니다 */
:root[data-reader="paper"]{--bg:#F4EFE4; --paper:#FAF6EE; --ink:#2F2A23; --muted:#7A7164; --line:#E2D9C8; --sand:#AE772C; --sand-soft:#EBDDC3; color-scheme:light}
:root[data-reader="sepia"]{--bg:#E9DCC3; --paper:#F1E6D0; --ink:#45382A; --muted:#7B6A54; --line:#D5C3A2; --sand:#985F22; --sand-soft:#DCC7A2; color-scheme:light}
:root[data-reader="green"]{--bg:#E2ECD8; --paper:#ECF3E4; --ink:#24322A; --muted:#5D6D60; --line:#C8D7BC; --sand:#86682A; --sand-soft:#D3DFC4; color-scheme:light}
:root[data-reader="night"]{--bg:#15171A; --paper:#1D2024; --ink:#D3CCBF; --muted:#8E887D; --line:#2D3136;
  --sand:#C99A55; --sand-soft:#3A3225; --ok:#6FC195; --bad:#E07B70; color-scheme:dark}
body{transition:background-color .3s,color .3s}
@media (prefers-reduced-motion:reduce){body{transition:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:4px}
.tag{font-size:.85rem;color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:440px){.side{align-items:flex-start}}
.reader{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.chip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;display:grid;place-items:center;font:600 .7rem var(--f-body)}
.chip[aria-pressed="true"]{border-color:var(--sand);box-shadow:0 0 0 2px var(--paper) inset}
.chip.paper{background:#FAF6EE;color:#2F2A23}.chip.sepia{background:#F1E6D0;color:#45382A}
.chip.green{background:#ECF3E4;color:#24322A}.chip.night{background:#1D2024;color:#D3CCBF}
h1{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.01em}
.streak{font-size:.85rem;color:var(--muted)}
.streak b{color:var(--sand);font-size:1.05rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
/* 연속 기록 카드: 동기 부여의 중심. 큰 숫자 + 최근 7일 점 + 다음 목표까지 */
.run{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.run .big{grid-row:span 2;display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);color:var(--sand);line-height:1}
.run .big b{font:600 2.6rem var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.run .big span{font-size:1rem;color:var(--ink)}
.run .say{font-size:.92rem;font-weight:500;line-height:1.45}
.run .say.warn{color:var(--bad)}
.week{display:flex;gap:6px}
.week i{display:flex;flex-direction:column;align-items:center;gap:3px;font:normal .66rem var(--f-ui);color:var(--muted)}
.week i::before{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.week i.on::before{background:var(--sand);border-color:var(--sand)}
.week i.today::before{outline:2px solid var(--sand);outline-offset:2px}
.week i.today{color:var(--ink);font-weight:600}
.goal{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);margin-top:6px}
.goal .bar{flex:1;height:6px;border-radius:99px;background:var(--sand-soft);overflow:hidden}
.goal .bar u{display:block;height:100%;background:var(--sand);border-radius:99px;transition:width .6s}
@media (max-width:440px){.run{grid-template-columns:1fr}.run .big{grid-row:auto}}
.done .big{font:600 2.2rem var(--f-ui);color:var(--sand);font-variant-numeric:tabular-nums}
.done .badge{display:inline-block;font:600 .8rem var(--f-ui);color:var(--paper);background:var(--sand);border-radius:99px;padding:3px 10px;margin-bottom:6px}
.tab{font:500 .95rem var(--f-ui);background:none;border:0;color:var(--muted);padding:10px 4px;margin-right:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sand)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.clock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 18px;box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
.clock::before{content:"";position:absolute;left:-1px;right:-1px;bottom:100%;height:22px;background:var(--bg)}
.clock svg{width:44px;height:66px;flex:none}
.clock .t{font:600 2rem var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .s{font-size:.82rem;color:var(--muted);margin-top:2px}
.clock .ctl{margin-left:auto;display:flex;gap:8px}
.btn{font:500 .9rem var(--f-ui);border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:440px){.clock{flex-wrap:wrap}.clock .ctl{margin-left:0;width:100%}.clock .ctl .btn{flex:1}}
.meta{font-size:.78rem;letter-spacing:.08em;color:var(--sand);text-transform:uppercase;font-weight:600}
article h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:6px 0 4px;text-wrap:balance}
.by{font-size:.85rem;color:var(--muted);margin-bottom:18px}
.text p{font-family:var(--f-body);font-size:1.08rem;line-height:1.95;margin:0 0 1em;word-break:keep-all}
.text p.d{padding-left:1em}
.text p.skip{text-align:center;color:var(--muted);font-family:var(--f-ui);font-size:.85rem;letter-spacing:.1em}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-10px}
.daynav span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.sm{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.35;cursor:default}
.gloss{border-top:1px solid var(--line);padding-top:14px;margin-top:8px;font-size:.88rem;color:var(--muted);display:grid;gap:4px}
.gloss b{color:var(--ink);font-weight:600;margin-right:6px}
.src{font-size:.78rem;color:var(--muted);margin-top:14px}
/* 한 줄 후킹: 글 위에서 왜 읽어야 하는지 먼저 보여 줍니다 */
.hook{background:var(--sand-soft);border-radius:14px;padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hook .lab{font:600 .75rem var(--f-ui);letter-spacing:.06em;color:var(--sand)}
.hook p{margin:0;font-family:var(--f-body);font-size:1.12rem;line-height:1.6;word-break:keep-all;text-wrap:pretty}
.hook .btn{margin-top:4px}
article h2{scroll-margin-top:190px}
@media (min-width:441px){article h2{scroll-margin-top:130px}}
.like{display:flex;justify-content:center;align-items:center;gap:10px;margin:28px 0 0;font-size:.9rem;color:var(--muted)}
.like button{font:600 .95rem var(--f-ui);padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.like button[aria-pressed="true"]{border-color:var(--sand);color:var(--sand);background:var(--sand-soft)}
.next{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:26px 0 4px}
#finishHint{text-align:center;font-size:.85rem;color:var(--muted);margin-top:6px}
.next .btn{display:inline-block;padding:14px 24px;font-size:1rem;text-decoration:none}
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:20px}
.quiz h3{margin:0;font:600 1.05rem var(--f-ui)}
.q p{margin:0 0 10px;font-weight:500;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:400 .95rem/1.5 var(--f-ui);padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sand)}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:500}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{font-size:.88rem;color:var(--muted);margin-top:8px;line-height:1.6}
.done{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.done .msg{flex:1;min-width:200px;font-family:var(--f-body);font-size:1.05rem}
.toast{font-size:.82rem;color:var(--ok)}
.shop{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.shop h3{margin:0;font:600 1rem var(--f-ui)}
.shop h3 small{font-weight:400;color:var(--muted);margin-left:6px;font-size:.8rem}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);text-decoration:none;min-width:0}
.item:hover{border-color:var(--sand)}
.item b{font-weight:600;font-size:.95rem}
.item span{font-size:.82rem;color:var(--muted);line-height:1.5}
.item em{font-style:normal;font-size:.8rem;color:var(--sand);margin-top:auto;padding-top:6px}
.item.nolink em{color:var(--muted)}
.banner{grid-column:1/-1;display:block;line-height:0;border-radius:8px;overflow:hidden}
.banner img{width:100%;max-width:728px;height:auto;display:block;margin:0 auto}
.disclose{font-size:.75rem;color:var(--muted);line-height:1.5}
.ad{min-height:120px;display:flex;align-items:center;justify-content:center}
.ad.ph{border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.82rem;text-align:center;padding:16px}
.ad-label{font-size:.7rem;letter-spacing:.08em;color:var(--muted);margin-bottom:-14px}
@media (prefers-reduced-motion:reduce){#stream{display:none}}
</style>
<style>
.foot{max-width:640px;margin:40px auto 0;padding-top:20px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:8px;line-height:1.6}
.foot nav{display:flex;gap:14px;flex-wrap:wrap}
.foot a,.fixednav a,.doc a{color:var(--ink)}
.fixednav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem}
.fixednav a{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.doc h1{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0}
.doc h2{font:600 1.05rem var(--f-ui);margin:26px 0 8px}
.doc p,.doc li{font-family:var(--f-body);font-size:1.02rem;line-height:1.85;word-break:keep-all}
.doc .home{font-size:.85rem;color:var(--muted);text-decoration:none}
.list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.list li a{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list li span{color:var(--muted);font:400 .82rem var(--f-ui);white-space:nowrap}
</style>
